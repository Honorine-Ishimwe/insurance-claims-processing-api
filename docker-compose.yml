# Local development stack (activates SPRING_PROFILES_ACTIVE=dev with demo users).
# For production, use: docker compose -f docker-compose.prod.yml --env-file .env up -d --build
services:
  postgres:
    image: postgres:16-alpine
    container_name: claims-postgres
    environment:
      POSTGRES_DB: claims
      POSTGRES_USER: claims
      POSTGRES_PASSWORD: ${DB_PASSWORD:-claims}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claims -d claims"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: claims-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://postgres:5432/claims
      DB_USERNAME: claims
      DB_PASSWORD: ${DB_PASSWORD:-claims}
    ports:
      - "8080:8080"
    restart: on-failure

volumes:
  pgdata:
