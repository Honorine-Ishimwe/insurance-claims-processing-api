# Base configuration shared by every environment.
# Secrets have NO defaults here: the app refuses to start unless they are provided
# (via environment variables, or the dev profile for local work).
spring:
  application:
    name: claims-api
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only checks it matches
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

security:
  jwt:
    # Base64, >= 32 bytes decoded. Generate with: openssl rand -base64 48
    secret: ${JWT_SECRET}
    ttl-minutes: ${JWT_TTL_MINUTES:60}
    issuer: claims-api

app:
  # Optional first admin account, created on startup only if no ADMIN exists yet.
  bootstrap-admin:
    username: ${BOOTSTRAP_ADMIN_USERNAME:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    full-name: ${BOOTSTRAP_ADMIN_FULL_NAME:Administrator}
  # Brute-force protection for /api/v1/auth/login and /register (per client IP).
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    max-requests: ${RATE_LIMIT_MAX_REQUESTS:10}
    window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}
  # Comma-separated list of browser origins allowed to call the API (for a future frontend).
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

claims:
  rules:
    timely-filing-days: 90

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true     # /actuator/health/liveness and /actuator/health/readiness
      show-details: never
  info:
    env:
      enabled: true

info:
  app:
    name: Insurance Claims Processing API
    version: '@project.version@'
