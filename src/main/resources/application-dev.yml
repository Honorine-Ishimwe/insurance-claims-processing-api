# LOCAL DEVELOPMENT ONLY. Activate with SPRING_PROFILES_ACTIVE=dev.
# Provides local defaults and loads demo users (password: "password").
# The production safety check refuses to start if this profile is combined with "prod".
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/claims}
    username: ${DB_USERNAME:claims}
    password: ${DB_PASSWORD:claims}
  flyway:
    locations: classpath:db/migration,classpath:db/demo

security:
  jwt:
    # Dev-only key. It is publicly known, so it is rejected when the prod profile is active.
    secret: ${JWT_SECRET:ZGV2LW9ubHktand0LXNlY3JldC1kby1ub3QtdXNlLWluLXByb2R1Y3Rpb24tZXZlci0xMjM=}
